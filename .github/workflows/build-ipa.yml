name: Build AuraBeat IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build AuraBeat.app (Unsigned Release for iPadOS)
        run: |
          xcodebuild \
            -project AuraBeat.xcodeproj \
            -scheme AuraBeat \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package AuraBeat.ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/AuraBeat.app Payload/
          zip -r -9 AuraBeat.ipa Payload
          ls -lh AuraBeat.ipa

      - name: Upload AuraBeat.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraBeat-iPad-IPA
          path: AuraBeat.ipa
